<svg xmlns="http://www.w3.org/2000/svg" width="145" height="28" viewBox="0 0 145 28" role="img" aria-label="Status: Live">
<title>Status: Live</title>
<defs>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#36e0b0" stop-opacity=".9"/><stop offset="1" stop-color="#36e0b0" stop-opacity=".25"/></linearGradient>
<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-80" x2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;305 0;305 0" keyTimes="0;.45;1" dur="4s" repeatCount="indefinite"/></linearGradient>
<clipPath id="r"><rect width="145" height="28" rx="14"/></clipPath>
