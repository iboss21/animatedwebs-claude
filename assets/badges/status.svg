<g clip-path="url(#r)">
<rect width="145" height="28" fill="#0b0a14"/>
<rect x="74" width="71" height="28" fill="#36e0b0" fill-opacity=".16"/>
<rect width="145" height="28" fill="url(#sheen)"/>
</g>
<rect x=".5" y=".5" width="144" height="27" rx="13.5" fill="none" stroke="url(#edge)"/>
<circle cx="14" cy="14" r="3" fill="#36e0b0"/>
<circle cx="88" cy="14" r="3.5" fill="#36e0b0"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="88" cy="14" r="3.5" fill="none" stroke="#36e0b0"><animate attributeName="r" values="3.5;9" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle>
<g font-family="JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600">
